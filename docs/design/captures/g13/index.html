<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G13 — Approvals Dock fixture</title>
    <style>
      body {
        margin: 0;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 1.5rem;
      }
      .hud-body {
        display: grid;
        grid-template-columns: 220px 1fr 280px;
        gap: 1rem;
        align-items: start;
      }
      .tall {
        background: var(--a-surface-2);
        border-radius: 8px;
      }
      .hud-body .tall {
        height: 1200px;
      }
      .mission-deck {
        margin-top: 1.5rem;
      }
      .mission-deck .tall {
        height: 1400px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hud-body">
        <div class="tall"></div>
        <div class="tall"></div>
        <div class="tall"></div>
      </div>
      <div class="mission-deck"><div class="tall"></div></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
