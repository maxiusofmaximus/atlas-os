name: eval-gate

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/eval-gate.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/eval-gate.yml'

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      # The golden suite is the CI gate for engine + capability invariants. It
      # includes `agent.loop_closes` and `agent.evidence_blocks_done` (RFC 63
      # §10) — the agent loop must run a tool, verify the artifact, and refuse a
      # `done` with no evidence. `--strict` fails the job on any non-pass.
      - name: golden eval gate (incl. agent capability)
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin atlas -- --profile ci eval run golden --strict
