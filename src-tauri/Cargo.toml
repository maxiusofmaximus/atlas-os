[package]
name = "atlas-os"
version = "0.1.1"
edition = "2021"
rust-version = "1.84"
description = "Atlas OS — Agent Engineering Operating System (AEOS) v1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/atlas-os/atlas-os"
default-run = "atlas-os"

[lib]
name = "atlas_os"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "atlas-os"
path = "src/main.rs"

[[bin]]
name = "atlas"
path = "src/cli/bin/opencode.rs"

# RFC 20 Phase 8 sub-fase 8.4 — Sister IDE-in-a-terminal entry point for
# thin PCs over SSH. Only compiled with `--features tui` (default off);
# default builds skip it. No new deps: owned text-frame Document Model.
[[bin]]
name = "atlas-tui"
path = "src/cli/bin/atlas-tui.rs"
required-features = ["tui", "cli"]

[features]
default = ["tauri", "hud", "lsp", "cli", "bundled-skills"]
tauri = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-process", "dep:tauri-plugin-opener", "dep:tauri-plugin-os", "dep:tauri-plugin-clipboard-manager"]
hud = ["dep:axum", "dep:tower-http", "dep:tower"]
lsp = ["dep:tower-lsp", "dep:lsp-types"]
fastembed = ["dep:fastembed"]
# Phase 9 sub-fase 9.1 (M33) — Laya "System One" classifier backend.
# Empty gate, default off: the RFC 25 §11 audit DIFERIDO the candle
# stack (candle-core/candle-nn/candle-transformers 0.9 + tokenizers
# 0.21 — rand 0.8 vs 0.9 conflict, axum 0.7 vs 0.8, runtime weights;
# see RFC 22 §7 AN-9.1), so `LayaClassifier` ships as a std-only MVP
# with zero new deps. The real ModernBERT + candle inference swaps in
# behind this same gate without changing callers. Default builds skip it.
laya = []
cli = ["dep:clap"]
# RFC 29 Section D — bundled skills catalog (12 `opencode-*` manifests
# under `skills/` compiled in via `include_str!`, ~1MB within the
# 30-45MB budget of RFC 20). Default on; `--no-default-features`
# drops it for server-only distributions.
bundled-skills = []
# RFC 28 Section C — Planner emits a DAG instead of a linear milestone
# list when enabled. Off by default; flip via `--features dag_mode` once
# the HUD <GraphView> toggle lands. petgraph is the only dependency
# this pulls in (~200 KB, pure Rust, MIT OR Apache-2.0).
dag_mode = ["dep:petgraph"]
# RFC 28 Section C — AST extraction of the codebase for the mission
# graph `EXTRACTED` provenance. Adds tree-sitter (~3 MB C runtime
# linked statically) + 2 grammars (~1 MB). Off by default — major
# binary size impact; enable when you want the meta-skill that maps
# Atlas OS's own Rust + Svelte sources into `mission_graph_*`.
codebase-graph = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-svelte-next"]
# RFC 11 Phase 9 sub-fase 9.2 (M34) — Tree-sitter AST Context Engine.
# Alias over `codebase-graph`: the audit (RFC 22 §7 AN-9.2) APROBADO
# reusing the vendored tree-sitter + grammars, so no new crates.
# `--features ast` enables the tree-sitter-accelerated
# `context::ast::extract` path; default builds keep the std-only
# heuristic with zero binary-size impact.
ast = ["codebase-graph"]
# RFC 28 Section B — Microsoft Intelligent Terminal ACP server. The
# OpenCode CLI becomes a first-class ACP agent (stdio JSON-RPC, v1
# stable wire) detectable by IT 0.1+ and any ACP-capable client. Off
# by default — Microsoft IT is Windows-only and the surface only
# matters when `WT_COM_CLSID` (or stdout-is-a-pipe heuristics) detect
# a host. Anchor: `agent-client-protocol = "2.0"` (Apache-2.0, MSRV
# 1.88). Only `unstable_session_fork` is enabled — that's the one v2
# draft feature RFC 28 §B needs; the rest of v2 surface stays off
# until ACP v2 stabilises. The crate's built-in `Stdio` transport
# drives the JSON-RPC loop over our existing tokio runtime, so no
# separate `sacp-tokio` / `agent-client-protocol-tokio` helper is
# pulled in (verified Jul 2026: there is no such crate on crates.io
# for the v2 line).
acp-server = ["dep:agent-client-protocol"]
# RFC 28 Section E — Firecrawl web ingestion (scrape, search, crawl).
# Adapter facade over the official Rust SDK `firecrawl = "2.12.1"` (MIT,
# by the Firecrawl team at Mendable AI Inc.). All callers go through
# `crate::firecrawl::facade`; the SDK is never imported directly outside
# `src/firecrawl/client.rs`. Off by default — pulls in reqwest deps that
# are transitively present already, plus a small SDK-shaped surface that
# adds ~250 KB to a desktop build. Self-hosted instances can be
# configured by setting `ATLAS_FIRECRAWL_URL` instead of
# `FIRECRAWL_API_KEY`; the facade handles both paths. No native deps —
# pure Rust, single-binary safe (RFC 25 §11).
firecrawl = ["dep:firecrawl"]
# Research 36 SECTOR B 8.3 — Command Center web remoto (SSO/OIDC).
# Empty gate: the owned bearer + OIDC-discovery shape lives in
# `src/remote_auth/` on every build; enabling `remote-ui` only tightens
# `GET /remote/status` to bearer-enforced (401 otherwise). The real
# `axum-oidc-layer`/`openidconnect` layer stays deferred (RFC 25 §11
# audit pending) and swaps in behind this same gate without changing
# callers. Default off — local-only HUD is the default posture.
remote-ui = []
# Research 36 SECTOR B 8.4 — Sister IDE-in-a-terminal. Empty gate: the
# owned text-frame Document Model (`src/sister/`, `atlas sister`) ships
# on every build; enabling `tui` additionally compiles the standalone
# `atlas-tui` binary (see `[[bin]]` above). The future alternate-screen
# renderer (ratatui, post-audit) reuses the same snapshot shape.
# Default off — desktop + headless CLI cover the default surface.
tui = []
# Research Engine Phase 3 sub-fase 3.2 — local document ingestion
# (anydoc scope: Word/PowerPoint/Excel/OpenDocument/RTF/EPUB/CSV/PDF →
# Markdown, plan 30 §B 3.2). Empty feature: the `research::ingest`
# parser is dependency-free by audit decision (RFC 25 §11 — the upstream
# anydoc toolchain is not a minimal-dependency Rust crate, so the plan's
# fallback branch applies: owned minimal parser + opt-in external
# `pandoc`, never bundled). The gate exists so default builds skip the
# `atlas research ingest` verb until the operator opts in.
doc-ingest = []
# RFC 28 Section F — Windows Toast notifications. AUMID registration +
# interactive Toasts with `on_activated`/`on_dismissed`/`on_failed`
# callbacks via `winrt-toast-reborn = "0.3.8"` (MIT, by Md. Iftakhar
# Awal Chowdhury / AtifChy, fork maintained of winrt-toast 0.1.1).
# Windows-only target (`cfg(windows)`); on other platforms the feature
# compiles to a no-op stub that logs via `tracing` and is testable
# without WinRT. The driver over `toast_queue` (M17) is platform-
# agnostic. Off by default — adds ~150 KB on Windows release builds.
# No `tauri-plugin-notification` fallback (bug tauri-apps#1545 makes
# the AUMID heuristic silently no-op on non-MSIX desktop; deep-link
# callbacks aren't exposed by the plugin anyway).
toast = ["dep:winrt-toast-reborn"]
# RFC 28 Section G — Calendar integration. Split into two sub-
# features because the surfaces are independently useful: `calendar-ics`
# (the WRITE path: publish mission events as an iCalendar feed served
# from the HUD axum server) requires only the pure-Rust `ics` crate
# (~50 KB, no native deps); `calendar-graph` (the READ path: poll
# Microsoft Graph `/me/calendarView` and inject busy windows into the
# Planning engine) pulls in `graph-rs-sdk` + `aes-gcm` for encrypted
# refresh-token storage + a 60-s tokio poller. The umbrella `calendar`
# feature turns both on; enable either sub-feature alone for a
# slimmer build. `ics = "0.5"` (MIT OR Apache-2.0, by hummingly) is
# pure Rust RFC 5545 emitter. The READ path uses the OAuth device-code
# flow over `reqwest` against a registered public client. Both default
# OFF — Phase 1.5g (and v3.1.1) are opt-in.
calendar = ["calendar-ics", "calendar-graph"]
calendar-ics = ["dep:ics", "dep:icalendar", "hud"]
calendar-graph = ["dep:aes-gcm", "dep:ring"]

[dependencies]
# Core async + errors
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
# RFC 04 §8 — Phase 2 sub-fase 2.4 feedback loop hot-swap primitive.
# `arc-swap 1.7` (MIT OR Apache-2.0, by Michal 'vorner' Vaner) provides
# `ArcSwap<T>` — a lock-free atomic container for `Arc<T>` whose `load`
# is wait-free on the read-mostly hot path (the orchestrator consults
# the affinity map on every routing decision). Zero transitive deps
# beyond `std`; single-binary safe per RFC 25 §11.
arc-swap = "1.7"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "load_extension"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
# `rand` is a transitive dep of `uuid v4` already; we surface it
# directly because `orchestrator::retry::RetryPolicy::decide` samples
# jitter ±25 % directly (RFC 28 §H.5 — jitter avoids thundering-herd
# on shared provider rate windows).
rand = "0.8"

# Embeddings (optional)
fastembed = { version = "4", optional = true }

# Tauri shell + plugins
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-os = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

# HUD local server (axum)
axum = { version = "0.7", optional = true, features = ["ws", "macros"] }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "fs"] }
tower = { version = "0.5", optional = true }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto"] }
http-body-util = "0.1"

# LSP (optional)
tower-lsp = { version = "0.20", optional = true }
lsp-types = { version = "0.97", optional = true }

# HTTP client for model providers
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking"], default-features = false }
eventsource-stream = "0.2"

# Token counting (RFC 04 §1 — pre-flight context-window check)
# tiktoken-rs es MIT/Apache-2.0, pesos BPE embebidos (~3MB por
# encoding). Sólo cargamos `o200k_base` (GPT-5/o3/4o) y `cl100k_base`
# (GPT-4/-3.5) — los demás providers usan el heurístico chars/4.
tiktoken-rs = "0.6"

# CLI
clap = { version = "4.5", optional = true, features = ["derive", "color", "env"] }
dirs = "5"

# File watching
notify = "7"
notify-debouncer-full = "0.4"

# Test + marketplace git-based temp clone dirs (12.1) — every target.
tempfile = "3"

# OS keychain (RFC 25 §3.10). The native backend is selected per-OS in the
# target sections below; with no backend feature keyring silently falls back
# to its `mock` store (no persistence), so those entries are required.
keyring = "3"

# Misc
once_cell = "1"
toml = "0.8"
indexmap = "2"
serde_yaml = "0.9"

# RFC 28 Section C — graph primitives (optional, gated `dag_mode`)
petgraph = { version = "0.8", optional = true, default-features = false, features = ["stable_graph"] }

# RFC 28 Section C — AST extraction (optional, gated `codebase-graph`)
# tree-sitter (0.26) bundles its C runtime, linked statically — see
# RFC 28 Section C Riesgos for binary-size justification.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-svelte-next = { version = "0.1", optional = true }

# RFC 28 Section B — Microsoft Intelligent Terminal ACP server
# (optional, gated `acp-server`). MSRV 1.88, OK con nuestro Rust 1.84
# de portability floor; el feature flag asegura que el binario default
# sin IT instalado no arrastra el crate. v1 stable wire sin features;
# `unstable_session_fork` habilita el futuro `/atlas fork` de RFC
# 28 §B. Sin helper tokio externo: el core crate provee `Stdio`.
agent-client-protocol = { version = "2.0", optional = true, features = ["unstable_session_fork"] }

# RFC 28 Section E — Firecrawl web ingestion (optional, gated
# `firecrawl`). Officially supported Rust SDK (MIT, Mendable AI Inc.).
# Default features OFF to trim binary surface — we only use the HTTP
# client + serde models, never the WebSocket crawler sub-protocol.
# `default-features = false` plus our explicit reqwest enablement keeps
# the dep tree shared with the existing model-provider reqwest (rustls).
firecrawl = { version = "2.12.1", optional = true, default-features = false }

# RFC 28 Section G — Calendar WRITE path (optional, gated
# `calendar-ics`). `ics 0.5` (MIT OR Apache-2.0, by hummingly) is a
# pure-Rust RFC 5545 emitter. Only depends on chrono — no native
# libs, single-binary safe (RFC 25 §11).
ics = { version = "0.5", optional = true, default-features = false, features = ["rfc7986"] }
# RFC 28 Section G — Calendar ICS READ path (v3.1.A). `icalendar` (hoodie)
# is the maintained RFC 5545 builder+parser (MIT/Apache, pure Rust, ~887k
# downloads). We use only its `parser` feature; `ics` stays the WRITE path.
icalendar = { version = "0.17", optional = true, default-features = false, features = ["parser"] }
# RFC 28 Section G — Calendar READ path (optional, gated `calendar-
# graph`). OAuth uses the device-code flow over `reqwest` (already a
# base dependency) against the registered public client — no webview.
# `aes-gcm 0.10` (MIT OR Apache-2.0) encrypts the refresh token at
# rest in SQLite; `ring` (MIT) supplies the system RNG.
aes-gcm = { version = "0.10", optional = true }
ring = { version = "0.17", optional = true }

# RFC 28 Section F — Windows Toast notifications (optional, gated
# `toast`). Windows-only FFI via windows-rs; the crate's `register()`
# call creates a Start Menu shortcut + registry AUMID so non-MSIX
# desktop apps can also receive activations. MIT, by AtifChy (fork).
# The `toast` feature gate plus `target_os = "windows"` keeps non-
# Windows builds clean; the stub module on other OSes logs via
# tracing and is unit-testable without WinRT.
[target.'cfg(windows)'.dependencies]
winrt-toast-reborn = { version = "0.3.8", optional = true }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Kernel keyutils: no system library (static-musl-safe; keyring's own Linux
# default). The D-Bus Secret Service backend needs libdbus-1-dev + pkg-config,
# which breaks the dependency-free static harness build.
keyring = { version = "3", features = ["linux-native"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = 1

[workspace]
members = []
