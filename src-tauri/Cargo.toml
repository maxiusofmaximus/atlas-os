[package]
name = "opencode-os"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
description = "OpenCode OS — Agent Engineering Operating System (AEOS) v1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/opencode-os/opencode-os"
default-run = "opencode-os"

[lib]
name = "opencode_os"
path = "src/lib.rs"

[[bin]]
name = "opencode-os"
path = "src/main.rs"

[[bin]]
name = "opencode"
path = "src/cli/bin/opencode.rs"

[features]
default = ["tauri", "hud", "lsp", "cli"]
tauri = ["dep:tauri"]
hud = ["dep:axum", "dep:tower-http", "dep:tower"]
lsp = ["dep:tower-lsp", "dep:lsp-types"]
fastembed = ["dep:fastembed"]
cli = ["dep:clap"]

[dependencies]
# Core async + errors
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"

# Storage
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "load_extension"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"

# Embeddings (optional)
fastembed = { version = "4", optional = true }

# Tauri shell + plugins
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"

# HUD local server (axum)
axum = { version = "0.7", optional = true, features = ["ws", "macros"] }
tower-http = { version = "0.6", optional = true, features = ["cors", "trace", "fs"] }
tower = { version = "0.5", optional = true }
hyper = "1"
hyper-util = { version = "0.1", features = ["server-auto"] }
http-body-util = "0.1"

# LSP (optional)
tower-lsp = { version = "0.20", optional = true }
lsp-types = { version = "0.97", optional = true }

# HTTP client for model providers
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
eventsource-stream = "0.2"

# CLI
clap = { version = "4.5", optional = true, features = ["derive", "color", "env"] }
dirs = "5"

# File watching
notify = "7"
notify-debouncer-full = "0.4"

# Git worktrees
git2 = { version = "0.19", features = ["vendored-libgit2"] }

# OS keychain
keyring = "3"

# Misc
once_cell = "1"
toml = "0.8"
indexmap = "2"
serde_yaml = "0.9"

# Test
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = 1

[workspace]
members = []
