[domain]
id = "coding"
title = "Software (default)"
version = "0.1.0"
detect = ["Cargo.toml", "package.json", "pyproject.toml", "go.mod", "*.rs", "*.ts", "*.py"]

[engines]
planning = "default"
coding = "default"
validation = ["tests.pass", "lint.clean"]

[skills]
bundled = ["prompt-clarify", "opencode-test"]

[mcp]
servers = []

[tools.lateral]
open = []
probe = "atlas domain probe coding"

[artifacts]
types = ["diff", "test_report"]

[policy]
sensitive = ["exec.run", "fs.write.*"]
sandbox = "local"
